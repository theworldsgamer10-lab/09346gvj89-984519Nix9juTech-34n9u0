name: Daily educational short

# Fires at 08:00 and 17:00 Asia/Dhaka. GitHub cron is UTC-only and has no
# timezone field, so UTC+6 becomes 02:00 and 11:00.
#
# Publishing is OFF by default. A video only reaches YouTube from a manual run
# with publish=true, or once you deliberately set the repo variable
# AUTO_PUBLISH=true.

on:
  schedule:
    - cron: "0 2,11 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Override the auto-picked topic (blank = follow curriculum)"
        required: false
        default: ""
      dry_run:
        description: "Pick a topic and build config only - render nothing"
        type: boolean
        default: false
      publish:
        description: "Upload to YouTube if the render succeeds"
        type: boolean
        default: false
      privacy:
        description: "YouTube privacy when publishing"
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

env:
  MPT_HOME: ${{ github.workspace }}/.mpt
  LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
  # Accept both naming schemes: the MPT_* names are what the earlier plan used.
  LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.MPT_LLM_API_KEY }}
  LLM_MODEL: ${{ vars.LLM_MODEL || 'llama-3.3-70b-versatile' }}
  VIDEO_SOURCE: ${{ vars.VIDEO_SOURCE || 'pixabay' }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.MPT_PEXELS_KEYS }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || secrets.MPT_PIXABAY_KEYS }}
  VOICE_NAME: ${{ vars.VOICE_NAME || 'en-US-AndrewNeural' }}
  AUTOPUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
  # Which publisher to use when publishing is enabled.
  #   youtube_api  (default) - your own project, no third party, no monthly cap.
  #                            Uploads may be locked to private until the
  #                            compliance audit passes - the upload step reads
  #                            the stored privacy back and says so explicitly.
  #   upload_post            - fallback only if the audit path blocks you
  PUBLISH_VIA: ${{ vars.PUBLISH_VIA || 'youtube_api' }}
  UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
  UPLOAD_POST_USERNAME: ${{ secrets.UPLOAD_POST_USERNAME }}

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade pip
          # mpt is the official MoneyPrinterTurbo package (same upstream author).
          pip install --quiet -r requirements.txt
          pip install --quiet "mpt==1.3.9"
          ffmpeg -version | head -1

      - name: Build config.toml from secrets
        run: python scripts/prepare_config.py

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Pick topic
        id: topic
        run: |
          set -euo pipefail
          python scripts/pick_topic.py --show
          if [ -n "${{ inputs.topic }}" ]; then
            python scripts/ci.py override-topic "${{ inputs.topic }}"
          fi
          python scripts/ci.py emit-topic

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: python scripts/ci.py plan

      - name: Render video
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          MPT_HOME="$MPT_HOME" python - <<'PY'
          import json, os, shlex, subprocess
          topic = json.load(open("out/topic.json"))
          cmd = [
              "mpt", "cli",
              "--video-subject", topic["subject"],
              "--video-aspect", "9:16",
              "--video-language", "en-US",
              "--paragraph-number", "1",
              "--video-count", "1",
              "--video-source", os.environ.get("VIDEO_SOURCE", "pexels"),
              "--video-clip-duration", "4",
              "--voice-name", os.environ.get("VOICE_NAME", "en-US-AndrewNeural"),
              "--voice-rate", "1.0",
              "--custom-system-prompt", topic["system_prompt"],
              "--subtitle-enabled",
              "--stop-at", "video",
          ]
          print("::group::render " + topic["subject"])
          print(" ".join(shlex.quote(c) for c in cmd))
          result = subprocess.run(cmd)
          print("::endgroup::")
          raise SystemExit(result.returncode)
          PY

      - name: Collect output
        id: out
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          ROOT="$MPT_HOME/storage/tasks"
          VIDEO="$(find "$ROOT" -name 'final-*.mp4' -size +100k -printf '%T@ %p\n' 2>/dev/null \
                   | sort -rn | head -1 | cut -d' ' -f2- || true)"
          if [ -z "${VIDEO:-}" ]; then
            echo "::error::no rendered mp4 found under $ROOT"
            find "$ROOT" -maxdepth 3 -type f 2>/dev/null | head -30 || true
            exit 1
          fi
          STEM="$(date -u +%Y-%m-%d)-run${{ github.run_number }}"
          mkdir -p out
          cp "$VIDEO" "out/${STEM}.mp4"
          ffmpeg -y -loglevel error -ss 2 -i "out/${STEM}.mp4" \
                 -frames:v 1 "out/${STEM}.png" || true
          {
            echo "video=out/${STEM}.mp4"
            echo "thumb=out/${STEM}.png"
            echo "stem=${STEM}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::rendered $(du -h "out/${STEM}.mp4" | cut -f1)"

      - name: Generate metadata
        if: ${{ steps.out.outcome == 'success' }}
        run: |
          set -euo pipefail
          python scripts/make_metadata.py \
            --topic "${{ steps.topic.outputs.subject }}" \
            --domain "${{ steps.topic.outputs.domain }}" \
            --out out/metadata.json
          python scripts/ci.py desc-file out/description.txt

      # ------------------------------------------------------------------ verify
      - name: Verify publisher credentials
        if: ${{ steps.out.outcome == 'success' && (inputs.publish || env.AUTOPUBLISH == 'true') }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_VIA" = "youtube_api" ]; then
            python scripts/youtube_upload.py \
              --file "${{ steps.out.outputs.video }}" \
              --title "$(python scripts/ci.py meta title)" \
              --dry-run
          else
            if [ -z "${UPLOAD_POST_API_KEY:-}" ] || [ -z "${UPLOAD_POST_USERNAME:-}" ]; then
              echo "::error::PUBLISH_VIA=upload_post but UPLOAD_POST_API_KEY / UPLOAD_POST_USERNAME are not set."
              echo "::error::Either add those two secrets, or set the repo variable PUBLISH_VIA=youtube_api."
              exit 1
            fi
            echo "::notice::Upload-Post configured for user ${UPLOAD_POST_USERNAME}"
          fi

      # ----------------------------------------------------------------- publish
      - name: Publish via Upload-Post
        if: ${{ steps.out.outcome == 'success' && (inputs.publish || env.AUTOPUBLISH == 'true') && env.PUBLISH_VIA == 'upload_post' }}
        run: |
          set -euo pipefail
          python scripts/publish_post.py \
            --file "${{ steps.out.outputs.video }}" \
            --title "$(python scripts/ci.py meta title)" \
            --description-file out/description.txt \
            --tags "$(python scripts/ci.py meta tags_csv)" \
            --platforms youtube \
            --privacy "${{ inputs.privacy || 'unlisted' }}" \
            --report out/upload.json

      - name: Publish via YouTube Data API
        if: ${{ steps.out.outcome == 'success' && (inputs.publish || env.AUTOPUBLISH == 'true') && env.PUBLISH_VIA == 'youtube_api' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/youtube_upload.py \
            --file "${{ steps.out.outputs.video }}" \
            --title "$(python scripts/ci.py meta title)" \
            --description-file out/description.txt \
            --tags "$(python scripts/ci.py meta tags_csv)" \
            --thumbnail "${{ steps.out.outputs.thumb }}" \
            --privacy "${{ inputs.privacy || 'private' }}" \
            --report out/upload.json

      - name: Commit topic history
        if: always() && !inputs.dry_run
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/used.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "topic: ${{ steps.topic.outputs.subject }} [skip ci]"
          git pull --rebase --autostash -q || true
          git push -q || echo "::warning::could not push state (next run will re-pick)"

      - name: Upload artifacts
        if: ${{ steps.out.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/*.mp4
            out/*.png
            out/metadata.json
            out/topic.json
          retention-days: 7

      - name: Telegram failure alert
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_TOKEN:-}" ]; then
            echo "no Telegram secrets set, skipping alert"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Run #${{ github.run_number }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null || true
